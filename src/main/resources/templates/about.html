<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'個人｜' + ${name}">個人</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

  <div class="bg-stack">
    <div class="bg bg-about active"></div>
  </div>

  <nav class="topnav">
    <a th:href="@{/}">← 回首頁</a>
  </nav>

  <main class="detail">
    <div class="sheet">
      <h1 th:text="${name}">姓名</h1>
      <p class="sub" th:text="${title} + '・' + ${school}">職稱</p>
      <p th:text="${intro}">簡介</p>

      <h2>聯絡方式</h2>
      <ul>
        <li>Email:<a th:href="'mailto:' + ${email}" th:text="${email}">email</a></li>
        <li>GitHub:<a th:href="${github}" th:text="${github}" target="_blank" rel="noopener">github</a></li>
      </ul>
    </div>
  </main>

</body>
</html>
